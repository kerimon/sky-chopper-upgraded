<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16213f">
<title>Sky Chopper</title>
<style>
:root{--ink:#fff7e6;--gold:#ffc83d;--hot:#ff5a3c;--navy:#16213f;--mint:#3ee0b8;color-scheme:dark;--sa:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--navy);color:var(--ink);font-family:"Trebuchet MS",Verdana,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hide{opacity:0!important;pointer-events:none!important;visibility:hidden}
.ov{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:rgba(10,16,40,.58);padding:14px;overflow:auto;transition:opacity .25s,visibility .25s}
.card{width:100%;max-width:440px;text-align:center;margin:auto}
h1{font-family:"Arial Black",Impact,sans-serif;font-size:clamp(40px,12vw,72px);margin:0;line-height:.92;color:var(--gold);text-shadow:4px 4px 0 var(--hot),0 0 24px rgba(255,200,61,.35);letter-spacing:-1px}
h2{font-family:"Arial Black",Impact,sans-serif;font-size:clamp(30px,8vw,46px);margin:0 0 8px;color:var(--gold);text-shadow:3px 3px 0 var(--hot)}
p{margin:8px 0;font-size:14px;line-height:1.4}
.sm{font-size:13px;opacity:.9}
.b{font:inherit;font-weight:800;font-size:16px;padding:10px 20px;border:3px solid var(--ink);background:#2a3a66;color:#fff;border-radius:12px;cursor:pointer;margin:4px;min-height:44px;transition:transform .08s,background .15s}
.b:hover{background:#3a4f8a}.b:active{transform:scale(.95)}
.b:focus-visible,.ib:focus-visible,#fly:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.pri{background:var(--hot);font-size:22px;padding:12px 38px;box-shadow:0 5px 0 #a8321d}.pri:hover{background:#ff7452}
.b[aria-pressed=true]{background:var(--gold);color:#2a1d00;border-color:#fff}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;margin:6px 0}
.sk{font-size:12px;padding:6px 8px;min-width:78px;line-height:1.25}.sk i{display:block;height:10px;border-radius:5px;margin:0 0 4px}
#hud{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;justify-content:space-between;align-items:flex-start;padding:calc(8px + var(--sa)) calc(10px + var(--sr)) 0 calc(10px + var(--sl));pointer-events:none;text-shadow:0 2px 4px rgba(0,0,0,.5);transition:opacity .25s}
#sc{font-family:"Arial Black",Impact,sans-serif;font-size:clamp(24px,6vw,36px);line-height:1}
#hud .sm{font-size:clamp(11px,2.8vw,13px)}
#shd{display:inline-block;margin-top:4px;padding:2px 10px;border-radius:10px;background:#3b9bff;font-size:12px;font-weight:800;transition:opacity .2s}
.ib{pointer-events:auto;width:42px;height:42px;border-radius:50%;border:2px solid var(--ink);background:rgba(22,33,63,.7);color:#fff;font:800 16px inherit;cursor:pointer;margin-left:6px}
#fly{position:fixed;z-index:6;right:calc(18px + var(--sr));bottom:calc(18px + var(--sb));width:96px;height:96px;border-radius:50%;border:4px solid var(--ink);background:rgba(255,90,60,.72);color:#fff;font:900 24px "Arial Black",Impact,sans-serif;display:none;align-items:center;justify-content:center;touch-action:none}
#fly.on{background:rgba(255,200,61,.9);color:#2a1d00}
@media (pointer:coarse){#fly{display:flex}}
#tip{position:fixed;z-index:6;left:50%;top:30%;transform:translateX(-50%);background:rgba(10,16,40,.75);color:var(--gold);padding:10px 18px;border-radius:12px;font:900 clamp(15px,4vw,22px) "Arial Black",Impact,sans-serif;text-align:center;max-width:92vw;transition:opacity .3s;pointer-events:none}
#toast{position:fixed;z-index:7;left:50%;top:calc(70px + var(--sa));transform:translateX(-50%);background:var(--gold);color:#2a1d00;padding:8px 16px;border-radius:20px;font-weight:800;font-size:14px;transition:opacity .3s;pointer-events:none;white-space:nowrap}
#hc{width:240px;height:120px;max-width:70vw}
@media (prefers-reduced-motion:reduce){.ov,#tip,#toast{transition:none}}
</style></head><body>
<canvas id="c" aria-label="Sky Chopper game"></canvas>
<div id="hud" class="hide"><div><div id="sc">0</div><div class="sm"><span id="bs"></span> · <span id="ds"></span> · <span id="cn"></span></div><div id="shd" class="hide">SHIELD ON</div></div><div><button class="ib" id="pz" aria-label="Pause">II</button><button class="ib sndb" aria-label="Toggle sound"></button></div></div>
<div id="tip" class="hide"></div><div id="toast" class="hide"></div>
<button id="fly" aria-label="Hold to fly">FLY</button>
<div id="menu" class="ov"><div class="card"><h1>Sky Chopper</h1><canvas id="hc" width="240" height="120"></canvas>
<p class="sm" id="mst"></p>
<div class="row" id="df" role="group" aria-label="Difficulty"><button class="b" data-d="easy">EASY</button><button class="b" data-d="normal">NORMAL</button><button class="b" data-d="hard">HARD</button></div>
<div class="row" id="sk" role="group" aria-label="Helicopter skins"></div>
<button class="b pri" id="play">TAKE OFF</button> <button class="b sndb" aria-label="Toggle sound"></button>
<p class="sm"><b>Hold</b> Space / W / ↑ / mouse / touch to fly up · <b>release</b> to descend<br>P pause · M sound · grab coins and the blue shield</p></div></div>
<div id="pause" class="ov hide"><div class="card"><h2>PAUSED</h2><button class="b pri" id="rs">RESUME</button><br><button class="b" id="rt">RESTART</button> <button class="b" id="pm">MAIN MENU</button></div></div>
<div id="over" class="ov hide"><div class="card"><h2 id="ot">CRASHED</h2><p id="o1" style="font-size:18px;font-weight:800"></p><p id="o2" class="sm"></p><p id="o3" style="color:var(--gold);font-weight:800"></p><button class="b pri" id="pa">PLAY AGAIN</button><br><button class="b" id="om">MAIN MENU</button></div></div>
<script>
'use strict';
const $=i=>document.getElementById(i),cv=$('c'),x=cv.getContext('2d'),hc=$('hc'),hx=hc.getContext('2d');
const LS={g(k,d){try{const v=localStorage.getItem('skych_'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},s(k,v){try{localStorage.setItem('skych_'+k,JSON.stringify(v))}catch(e){}}};
const SK=[{n:'Classic',a:'#e8452f',b:'#ff9a6c',c:0},{n:'Ocean',a:'#2f7de8',b:'#7fd0ff',c:80},{n:'Gold',a:'#c9931a',b:'#ffe27a',c:200},{n:'Stealth',a:'#262a38',b:'#6f789a',c:400}];
const DF={easy:{sp:.85,gp:1.3,hz:.55,wn:2},normal:{sp:1,gp:1,hz:1,wn:1.5},hard:{sp:1.2,gp:.82,hz:1.5,wn:1.2}};
let best=+LS.g('best',0)||0,wallet=+LS.g('coins',0)||0,own=LS.g('own',[0]),skin=+LS.g('skin',0)||0,diff=LS.g('diff','normal'),sOn=LS.g('snd',true)!==false,tutDone=!!LS.g('tut',false),mil=+LS.g('mil',0)||0;
if(!Array.isArray(own))own=[0];if(!SK[skin]||!own.includes(skin))skin=0;if(!DF[diff])diff='normal';
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
const rn=(a,b)=>a+Math.random()*(b-a),ri=n=>Math.random()*n|0,rgb=a=>'rgb('+a+')',Lc=(a,b,k)=>a.map((v,i)=>Math.round(v+(b[i]-v)*k));
function cull(a,f){let j=0;for(let i=0;i<a.length;i++)if(f(a[i]))a[j++]=a[i];a.length=j}
// ---- layout
let W,H,DPR,sc,LW,oy;const LH=900,GY=860;
function rs(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR|0;cv.height=H*DPR|0;sc=W<H?W/900:Math.min(W/1700,H/LH);LW=W/sc;oy=(H/sc-LH)/2}
addEventListener('resize',rs);addEventListener('orientationchange',()=>setTimeout(rs,200));rs();
// ---- audio (created only after a user gesture)
let AC,unl=false;
function snd(f,d,ty,v,f2,del){if(!sOn||!unl)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime+(del||0);o.type=ty;o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+d)}catch(e){}}
const SFX={start:()=>snd(300,.15,'square',.05,700),coin:()=>snd(880,.09,'sine',.06,1320),shield:()=>snd(500,.22,'sine',.07,1200),hit:()=>snd(200,.25,'sawtooth',.08,60),crash:()=>snd(130,.6,'sawtooth',.1,30),rec:()=>[523,659,784,1046].forEach((f,i)=>snd(f,.2,'triangle',.07,0,i*.12)),buy:()=>snd(600,.15,'triangle',.06,900)};
['pointerdown','keydown'].forEach(v=>addEventListener(v,()=>{unl=true},{capture:true}));
function setSnd(v){sOn=v;LS.s('snd',v);document.querySelectorAll('.sndb').forEach(b=>{b.textContent=v?'♪':'✕';b.setAttribute('aria-pressed',v?'true':'false');b.title=v?'Sound on':'Sound off'})}
// ---- state
let mode='menu',h,ob=[],bd=[],ms=[],sm=[],co=[],pw=[],pt=[],tx=[],dist=0,runC=0,sp=250,spawn=0,t=0,shake=0,inv=0,bg=0,overT=0,ovShown=false,tipT=0,lastT='',newRec=false,prevMode='play',last=0;
const hs=new Set(),hold=()=>hs.size>0,score=()=>Math.floor(dist/10)+runC*10;
const ST=Array.from({length:70},()=>({x:Math.random(),y:Math.random()*.7,r:Math.random()*1.6+.5,p:Math.random()*6})),CL=Array.from({length:12},()=>({x:Math.random(),y:Math.random(),s:rn(.7,1.8),z:rn(.2,.6)}));
const E=[{t:[96,176,255],b:[214,238,255],n:0,s:0},{t:[255,128,98],b:[255,214,150],n:0,s:0},{t:[52,58,92],b:[120,128,160],n:0,s:1},{t:[10,14,44],b:[44,54,110],n:1,s:0}];
function env(d){const p=(d/9000)%4,i=Math.floor(p),f=Math.max(0,(p-i-.72)/.28),k=f*f*(3-2*f),a=E[i],b=E[(i+1)%4];return{t:Lc(a.t,b.t,k),b:Lc(a.b,b.b,k),n:a.n+(b.n-a.n)*k,s:a.s+(b.s-a.s)*k}}
// ---- UI helpers
let tt=0;function toast(m){const e=$('toast');e.textContent=m;e.classList.remove('hide');clearTimeout(tt);tt=setTimeout(()=>e.classList.add('hide'),2600)}
function show(id){['menu','pause','over'].forEach(k=>$(k).classList.toggle('hide',k!=id));if(id){const b=$(id).querySelector('.pri');if(b)setTimeout(()=>b.focus({preventScroll:true}),40)}}
function tip(m){const e=$('tip');if(m){e.textContent=m;e.classList.remove('hide')}else e.classList.add('hide')}
function renderMenu(){$('mst').textContent='Best '+best+'  ·  Coins '+wallet;document.querySelectorAll('#df .b').forEach(b=>b.setAttribute('aria-pressed',b.dataset.d==diff?'true':'false'));
 $('sk').innerHTML='';SK.forEach((s,i)=>{const b=document.createElement('button');b.className='b sk';b.setAttribute('aria-pressed',i==skin?'true':'false');b.innerHTML='<i style="background:linear-gradient(90deg,'+s.a+','+s.b+')"></i>'+s.n+'<br>'+(own.includes(i)?(i==skin?'In use':'Owned'):s.c+' coins');b.onclick=()=>{if(own.includes(i)){skin=i;LS.s('skin',i)}else if(wallet>=s.c){wallet-=s.c;own.push(i);skin=i;LS.s('coins',wallet);LS.s('own',own);LS.s('skin',i);SFX.buy();toast(s.n+' unlocked')}else toast('Need '+(s.c-wallet)+' more coins');renderMenu()};$('sk').appendChild(b)})}
// ---- game flow
function reset(){h={x:56,y:GY-15,vy:0,sh:0,tl:0};ob.length=bd.length=ms.length=sm.length=co.length=pw.length=pt.length=tx.length=0;dist=0;runC=0;spawn=60;inv=0;shake=0;lastT='';overT=0;ovShown=false;newRec=false;tipT=0;hs.clear();mode='ready';show(null);$('hud').classList.remove('hide');tip(tutDone?'HOLD TO TAKE OFF':'HOLD TO FLY UP — RELEASE TO DESCEND')}
function toMenu(){mode='menu';hs.clear();tip(null);$('hud').classList.add('hide');renderMenu();show('menu')}
function pause(){if(mode!='play')return;mode='pause';hs.clear();show('pause')}
function resume(){if(mode!='pause')return;mode='play';hs.clear();last=performance.now();show(null)}
function save(){LS.s('coins',wallet);LS.s('best',best)}
function crash(){if(mode!='play')return;mode='over';shake=RM?0:18;SFX.crash();burst(h.x,h.y,34,'#ff8a3c',320);burst(h.x,h.y,14,'#444',180);const s=score();wallet+=runC;newRec=s>best;if(newRec){best=s;setTimeout(SFX.rec,500)}save();hs.clear();tip(null)}
function hurt(src){if(mode!='play'||inv>0)return false;if(h.sh){h.sh=0;inv=1.6;shake=RM?0:9;SFX.hit();burst(h.x,h.y,16,'#6cc6ff',220);if(src)src.dead=1;return true}crash();return true}
$('play').onclick=()=>{SFX.start();reset()};$('pa').onclick=()=>{SFX.start();reset()};$('rt').onclick=()=>{SFX.start();reset()};
$('rs').onclick=resume;$('pm').onclick=toMenu;$('om').onclick=toMenu;$('pz').onclick=pause;
document.querySelectorAll('.sndb').forEach(b=>b.onclick=()=>setSnd(!sOn));
document.querySelectorAll('#df .b').forEach(b=>b.onclick=()=>{diff=b.dataset.d;LS.s('diff',diff);renderMenu()});
// ---- input
function key(e,down){const c=e.code;if(c=='Space'||c=='ArrowUp'||c=='KeyW'){if(mode=='ready'||mode=='play'){e.preventDefault();down?hs.add('k'+c):hs.delete('k'+c)}else if(!down)hs.delete('k'+c)}else if(down&&!e.repeat){if(c=='KeyP'||c=='Escape')mode=='pause'?resume():pause();else if(c=='KeyM')setSnd(!sOn)}}
addEventListener('keydown',e=>key(e,true));addEventListener('keyup',e=>key(e,false));
function bind(el){el.addEventListener('pointerdown',e=>{e.preventDefault();hs.add('p'+e.pointerId);el.classList&&el.id=='fly'&&el.classList.add('on');try{el.setPointerCapture(e.pointerId)}catch(_){}});['pointerup','pointercancel','lostpointercapture'].forEach(v=>el.addEventListener(v,e=>{hs.delete('p'+e.pointerId);if(el.id=='fly'&&![...hs].some(k=>k[0]=='p'))el.classList.remove('on')}))}
bind(cv);bind($('fly'));
function lost(){hs.clear();$('fly').classList.remove('on');if(mode=='play')pause();save()}
addEventListener('blur',lost);document.addEventListener('visibilitychange',()=>{if(document.hidden)lost()});
document.addEventListener('contextmenu',e=>e.preventDefault());
// ---- spawning
function coins(X,Y,k){const n=k==1?7:6;for(let i=0;i<n;i++)co.push({x:X+i*34,y:k==0?Y-Math.sin(i/(n-1)*Math.PI)*40:k==1?Y:Y+(i%2?-24:24),g:0})}
function wave(){const dm=dist/10,D=DF[diff],L=Math.min(dm/1200,1),X=LW+100;
 const Wt=[['r',3],['d',dm>400?1.4:0],['b',dm>250?1.4*D.hz:0],['m',dm>500?D.hz:0],['s',dm>800?D.hz:0],['c',1.3],['p',h.sh?0:.35]];let tot=0;for(const w of Wt)tot+=w[1];let r=Math.random()*tot,ty='r';for(const w of Wt){if((r-=w[1])<=0){ty=w[0];break}}
 if(ty==lastT&&'msb'.includes(ty))ty='r';lastT=ty;
 const add=(w,top,bot,fy,fh,dx)=>ob.push({x:X+dx,w,top,bot,fy,fh,s:ri(1e5)});
 if(ty=='r'){const k=ri(3),w=rn(90,130),T=rn(110,190+L*90);let cy;if(k==0){add(w,T,0,0,0,0);cy=(T+LH)/2}else if(k==1){add(w,0,T,0,0,0);cy=(LH-T)/2}else{const fh=rn(40,65),fy=rn(fh+200,LH-fh-200);add(rn(120,170),0,0,fy,fh,0);cy=fy>LH/2?fy-fh-110:fy+fh+110}if(Math.random()<.7)coins(X+w/2-60,cy,ri(2))}
 else if(ty=='d'){add(rn(120,150),0,0,rn(230,310),rn(40,55),0);add(rn(120,150),0,0,rn(590,670),rn(40,55),210);coins(X+110,LH/2,1)}
 else if(ty=='b'){const n=1+ri(2+(L>.5?1:0));for(let i=0;i<n;i++)bd.push({x:X+i*100,y:rn(120,LH-240),v:rn(70,130),p:rn(0,6),yy:0})}
 else if(ty=='m'){ms.push({x:LW-30,y:h.y,w:D.wn,fire:0})}
 else if(ty=='s'){sm.push({x:X,y:rn(200,420),t:0,yy:0,ph:0})}
 else if(ty=='c')coins(X,rn(220,LH-220),ri(3));
 else pw.push({x:X,y:rn(220,LH-220)});
 spawn=Math.max(330,rn(430,580)*D.gp-L*110)}
function burst(X,Y,n,c,s){if(RM)n=Math.ceil(n/3);for(let i=0;i<n&&pt.length<260;i++){const a=rn(0,6.3),v=rn(30,s);pt.push({x:X,y:Y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:rn(.3,.8),m:.8,c,s:rn(2,6)})}}
function cr(cx,cy,r,a,b,w,hh){const px=Math.max(a,Math.min(cx,a+w)),py=Math.max(b,Math.min(cy,b+hh));return(cx-px)*(cx-px)+(cy-py)*(cy-py)<r*r}
// ---- update
function update(dt){t+=dt;shake*=.9;
 if(mode=='menu'){bg+=70*dt;return}
 for(const p of pt){p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt}cull(pt,p=>p.l>0);for(const q of tx){q.y-=40*dt;q.l-=dt}cull(tx,q=>q.l>0);
 if(mode=='ready'){if(hold()){mode='play';inv=1.2;SFX.start();if(tutDone)tip(null)}return}
 if(mode=='over'){overT+=dt;if(overT>.45&&!ovShown){ovShown=true;const s=score();$('o1').textContent='Score '+s;$('o2').textContent=Math.floor(dist/10)+' m  ·  '+runC+' coins  ·  Best '+best;$('o3').textContent=newRec?'NEW RECORD!':'';$('ot').textContent=newRec?'NEW BEST':'CRASHED';show('over')}return}
 if(mode!='play')return;
 const D=DF[diff],dm=dist/10;
 if(!tutDone){tipT+=dt;if(tipT>4.5){tutDone=true;LS.s('tut',true);tip(null)}}
 sp=(255+Math.min(dist*.018,200))*D.sp*(.8+.2*Math.min(1,dist/1500));dist+=sp*dt;spawn-=sp*dt;if(spawn<=0)wave();
 h.vy+=((hold()?-380:400)-h.vy)*Math.min(1,dt*4.5);h.y+=h.vy*dt;h.tl+=((h.vy/400)*.3-h.tl)*Math.min(1,dt*8);if(inv>0)inv-=dt;
 if(h.y<24){h.y=24;h.vy=Math.max(0,h.vy)}
 if(700-dist>h.x-20&&h.y>GY-15){h.y=GY-15;h.vy=Math.min(0,h.vy)}
 if(h.y>LH-22){crash();return}
 if(!RM&&Math.random()<.5)pt.push({x:h.x-20,y:h.y+3,vx:-sp*.4,vy:rn(-15,15),l:.5,m:.5,c:'rgba(255,255,255,.55)',s:rn(3,6)});
 const S=.8,p1=[h.x+2,h.y,11*S],p2=[h.x-24*S,h.y-5*S,5*S];
 const hitC=(a,b,w,hh)=>cr(p1[0],p1[1],p1[2],a,b,w,hh)||cr(p2[0],p2[1],p2[2],a,b,w,hh);
 for(const o of ob){o.x-=sp*dt;if(o.top>0&&hitC(o.x+10,-50,o.w-20,o.top+44)||o.bot>0&&hitC(o.x+10,LH-o.bot+6,o.w-20,o.bot+50)||o.fh&&hitC(o.x+8,o.fy-o.fh+6,o.w-16,o.fh*2-12))hurt(null)}
 for(const b of bd){b.x-=(sp+b.v)*dt;b.p+=dt*10;b.yy=b.y+Math.sin(b.p*.3)*6;if(Math.hypot(h.x-b.x,h.y-b.yy)<16)hurt(b)}
 for(const m of ms){if(m.w>0){m.w-=dt;if(m.w>.4)m.y+=(h.y-m.y)*Math.min(1,dt*4)}else{m.x-=(sp+380)*dt;if(!RM&&Math.random()<.8)pt.push({x:m.x+16,y:m.y,vx:rn(0,60),vy:rn(-20,20),l:.4,m:.4,c:'#ffb347',s:4});if(cr(h.x,h.y,9,m.x-14,m.y-5,28,10))hurt(m)}}
